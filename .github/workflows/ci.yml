name: CI

on: # 1
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify: # 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 3
      - uses: shivammathur/setup-php@v2 # 4
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist # 5
      - run: cp .env.example .env # 6
      - run: php artisan key:generate
      - run: composer verify # 7
