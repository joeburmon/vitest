name: CI

on: # 1
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify: # 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # 3
      - uses: shivammathur/setup-php@v2 # 4
        with:
          php-version: '8.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: composer setup # 5
      - run: composer verify # 7
